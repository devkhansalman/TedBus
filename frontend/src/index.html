<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TedBus — Book Bus Tickets Online</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TedBus — Book bus tickets online easily. Search buses, compare routes, select seats and pay securely. Delhi to Jaipur, Mumbai to Goa and more." />
    <meta name="theme-color" content="#D84E55" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/red-bus-with-word-bus-it_600323-482.avif" />

    <!-- Font Awesome (only one version) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async></script>

    <!-- Dark mode flash prevention — runs before Angular boots -->
    <script>
      try {
        if (localStorage.getItem('tedbus-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
