<h2 mat-dialog-title>{{ 'HOME.BUS_ROUTES_AVAILABLE' | translate }}</h2>
<mat-dialog-content class="mat-typography">

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> {{ 'COMMON.NO' | translate }} </th>
      <td mat-cell *matCellDef="let element"> {{element.position}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="from">
      <th mat-header-cell *matHeaderCellDef> {{ 'COMMON.FROM' | translate }} </th>
      <td mat-cell *matCellDef="let element"> {{element.from}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="to">
      <th mat-header-cell *matHeaderCellDef> {{ 'COMMON.TO' | translate }} </th>
      <td mat-cell *matCellDef="let element"> {{element.to}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <ng-container matColumnDef="nobus">
      <th mat-header-cell *matHeaderCellDef> {{ 'HOME.NO_OF_BUSES' | translate }} </th>
      <td mat-cell *matCellDef="let element"> {{element.nobus}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>




</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ 'COMMON.CANCEL' | translate }}</button>
</mat-dialog-actions>
