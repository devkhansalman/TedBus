<!-- navbar.component.html -->
<nav class="px-4 md:px-14 py-2 flex items-center justify-between sticky top-0 bg-white dark:bg-[#1E293B] z-[1050] border-b border-slate-100 dark:border-white/10 shadow-sm transition-colors duration-300">

  <!-- Left: Logo & Desktop Links -->
  <div class="flex items-center gap-4 lg:gap-8">
    
    <!-- Mobile Hamburger Menu Button -->
    <button (click)="toggleMobileMenu()"
            type="button"
            class="md:hidden flex items-center justify-center p-1.5 rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
            aria-label="Toggle Navigation Menu">
      <span class="material-icons text-2xl">{{ isMobileMenuOpen ? 'close' : 'menu' }}</span>
    </button>

    <!-- Logo -->
    <div class="grid place-content-center cursor-pointer" (click)="navigate('/')">
      <img class="w-11 h-11 sm:w-12 sm:h-12 rounded-full object-cover border border-slate-200 dark:border-slate-700 shadow-sm"
           src="assets/red-bus-with-word-bus-it_600323-482.avif" alt="Tedbus Logo" />
    </div>

    <!-- Desktop Navigation Links (hidden on mobile, visible on md+) -->
    <div class="hidden md:flex items-center gap-2 lg:gap-4 pl-4 border-l border-slate-200 dark:border-slate-700">
      
      <!-- Bus Tickets -->
      <a (click)="navigate('/')"
         class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
        <span class="material-icons text-red-600 text-lg">directions_bus</span>
        <span>{{ 'NAVBAR.BUS_TICKETS' | translate }}</span>
      </a>

      <!-- Community -->
      <a (click)="navigate('/community')"
         class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
        <span class="material-icons text-indigo-600 text-lg">groups</span>
        <span>{{ 'NAVBAR.COMMUNITY' | translate }}</span>
      </a>

    </div>
  </div>

  <!-- Right: Controls & Actions -->
  <div class="flex items-center gap-2.5 sm:gap-3.5">
    
    <!-- Notification Bell -->
    <button *ngIf="isLoggedIn" 
            type="button"
            class="relative flex items-center justify-center h-10 w-10 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition cursor-pointer" 
            (click)="toggleNotifications($event)"
            title="{{ 'NAVBAR.NOTIFICATIONS' | translate }}">
      <span class="material-icons text-xl">notifications_none</span>
      <span *ngIf="unreadCount > 0" 
            class="absolute top-1 right-1 bg-red-600 text-white text-[10px] font-black rounded-full min-w-[16px] h-[16px] flex items-center justify-center px-0.5 border border-white dark:border-[#1E293B]">
        {{ unreadCount > 99 ? '99+' : unreadCount }}
      </span>
    </button>

    <!-- Language Selector -->
    <button [matMenuTriggerFor]="langMenu"
            type="button"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-bold text-slate-700 dark:text-slate-200 transition cursor-pointer">
      <span class="material-icons text-base text-slate-500 dark:text-slate-400">language</span>
      <span class="hidden sm:inline">{{ languageService.getCurrentLanguage() === 'hi' ? 'हिन्दी' : 'English' }}</span>
      <span class="sm:hidden uppercase font-black text-xs">{{ languageService.getCurrentLanguage() }}</span>
      <span class="material-icons text-sm text-slate-400">expand_more</span>
    </button>

    <mat-menu #langMenu="matMenu">
      <button mat-menu-item (click)="switchLanguage('en')" [class.font-bold]="languageService.getCurrentLanguage() === 'en'">
        <span class="mr-2">🇬🇧</span> English
      </button>
      <button mat-menu-item (click)="switchLanguage('hi')" [class.font-bold]="languageService.getCurrentLanguage() === 'hi'">
        <span class="mr-2">🇮🇳</span> हिन्दी (Hindi)
      </button>
    </mat-menu>

    <!-- Dark / Light Theme Toggle -->
    <button type="button"
            class="flex items-center justify-center h-10 w-10 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-amber-400 transition cursor-pointer"
            (click)="toggleTheme()"
            [attr.aria-label]="themeService.isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
            [attr.title]="themeService.isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <span class="material-icons text-xl">{{ themeService.isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
    </button>

    <!-- Google Sign-in Button & Sign-In Modal Button if not logged in -->
    <div id="google-btn" *ngIf="!isLoggedIn" class="shrink-0"></div>
    <button *ngIf="!isLoggedIn"
            (click)="openSignInModal()"
            type="button"
            class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold text-sm shadow-sm transition cursor-pointer">
      <span class="material-icons text-base">login</span>
      <span>Sign In</span>
    </button>

    <!-- Logged in Account Dropdown -->
    <button *ngIf="isLoggedIn" 
            [matMenuTriggerFor]="accountMenu"
            type="button"
            class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 text-sm font-bold text-slate-900 dark:text-[#F8FAFC] transition cursor-pointer">
      <span class="material-icons text-lg text-red-600">account_circle</span>
      <span>{{ 'NAVBAR.ACCOUNT' | translate }}</span>
      <span class="material-icons text-sm text-slate-400">expand_more</span>
    </button>

    <mat-menu #accountMenu="matMenu">
      <button mat-menu-item (click)="navigate('/profile', 'trips')">
        <span class="material-icons text-sm mr-2 text-red-500">confirmation_number</span>
        {{ 'NAVBAR.MY_TRIPS' | translate }}
      </button>
      <button mat-menu-item (click)="navigate('/profile', 'wallet')">
        <span class="material-icons text-sm mr-2 text-amber-500">account_balance_wallet</span>
        {{ 'NAVBAR.WALLET' | translate }}
      </button>
      <button mat-menu-item (click)="navigate('/profile', 'profile')">
        <span class="material-icons text-sm mr-2 text-indigo-500">person</span>
        {{ 'NAVBAR.PROFILE' | translate }}
      </button>
      <button mat-menu-item (click)="handlelogout()">
        <span class="material-icons text-sm mr-2 text-slate-500">logout</span>
        {{ 'NAVBAR.LOGOUT' | translate }}
      </button>
    </mat-menu>
  </div>

  <!-- Mobile Slide-over Drawer Menu Overlay -->
  <div *ngIf="isMobileMenuOpen"
       (click)="toggleMobileMenu()"
       class="md:hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[1100]"></div>

  <!-- Mobile Navigation Drawer Panel -->
  <div *ngIf="isMobileMenuOpen"
       class="md:hidden fixed top-0 left-0 bottom-0 w-[270px] bg-white dark:bg-[#1E293B] z-[1200] shadow-2xl p-4 flex flex-col justify-between transition-transform duration-300">
    
    <div class="space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <img class="w-11 h-11 rounded-full object-cover border border-slate-200 dark:border-slate-700 shadow-sm" src="assets/red-bus-with-word-bus-it_600323-482.avif" alt="Tedbus Logo" />
        <button (click)="toggleMobileMenu()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <span class="material-icons text-xl">close</span>
        </button>
      </div>

      <nav class="space-y-2">
        <a (click)="navigate('/')"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-sm text-slate-800 dark:text-[#F8FAFC] hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
          <span class="material-icons text-red-600 text-xl">directions_bus</span>
          <span>{{ 'NAVBAR.BUS_TICKETS' | translate }}</span>
        </a>

        <a (click)="navigate('/community')"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-sm text-slate-800 dark:text-[#F8FAFC] hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
          <span class="material-icons text-indigo-600 text-xl">groups</span>
          <span>{{ 'NAVBAR.COMMUNITY' | translate }}</span>
        </a>

        <a (click)="navigate('/profile', 'trips')"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-sm text-slate-800 dark:text-[#F8FAFC] hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
          <span class="material-icons text-emerald-600 text-xl">confirmation_number</span>
          <span>{{ 'NAVBAR.MY_TRIPS' | translate }}</span>
        </a>

        <a (click)="navigate('/profile', 'profile')"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-sm text-slate-800 dark:text-[#F8FAFC] hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
          <span class="material-icons text-blue-600 text-xl">person</span>
          <span>{{ 'NAVBAR.PROFILE' | translate }}</span>
        </a>
      </nav>
    </div>

    <!-- Drawer Footer -->
    <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
      <button *ngIf="!isLoggedIn"
              (click)="openSignInModal()"
              class="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg bg-red-600 hover:bg-red-700 text-white font-bold text-sm transition">
        <span class="material-icons text-base">login</span>
        <span>Sign In</span>
      </button>

      <button *ngIf="isLoggedIn"
              (click)="handlelogout()"
              class="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg bg-red-50 text-red-600 dark:bg-red-950/40 dark:text-red-400 font-bold text-sm">
        <span class="material-icons text-base">logout</span>
        <span>{{ 'NAVBAR.LOGOUT' | translate }}</span>
      </button>
    </div>

  </div>
</nav>

<app-notification-panel [isOpen]="isNotificationPanelOpen" (closed)="isNotificationPanelOpen = false"></app-notification-panel>
