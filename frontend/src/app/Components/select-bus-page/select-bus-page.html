<div class="selectBus w-full min-h-screen bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
  <app-header></app-header>

  <!-- Mobile & Tablet Filter Bar Trigger -->
  <div class="lg:hidden px-3 py-2.5 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 flex items-center justify-between shadow-xs">
    <button
      type="button"
      (click)="toggleFilterDrawer()"
      class="flex items-center gap-2 px-3.5 py-2 text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl border border-slate-300 dark:border-slate-600 transition cursor-pointer active:scale-95"
    >
      <mat-icon class="text-red-500 text-sm">filter_list</mat-icon>
      <span>{{ 'BOOKING.FILTERS' | translate }}</span>
    </button>
    <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">
      {{ 'BOOKING.BUSES_LIST' | translate }}
    </span>
  </div>

  <div class="SelectBUS_MAINCONTENT max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 py-4 grid grid-cols-1 lg:grid-cols-[280px_1fr] gap-6 items-start">
    <!-- Desktop Left Sidebar -->
    <aside class="hidden lg:block sticky top-6">
      <app-left></app-left>
    </aside>

    <!-- Main Bus List Area -->
    <main class="w-full min-w-0">
      <app-right></app-right>
    </main>
  </div>

  <!-- Mobile & Tablet Slide-Over Filter Drawer -->
  <div *ngIf="isFilterDrawerOpen" class="lg:hidden fixed inset-0 z-[100] flex">
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity"
      (click)="closeFilterDrawer()"
    ></div>

    <!-- Drawer Panel -->
    <div
      class="relative ml-auto w-full max-w-sm sm:max-w-md h-full bg-white dark:bg-slate-900 shadow-2xl flex flex-col z-10 overflow-hidden animate-in slide-in-from-right duration-300"
    >
      <!-- Drawer Header -->
      <div class="p-4 bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-2">
          <mat-icon class="text-red-500">filter_list</mat-icon>
          <span>{{ 'BOOKING.FILTERS' | translate }}</span>
        </h3>
        <button
          type="button"
          (click)="closeFilterDrawer()"
          class="p-1.5 rounded-full text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700 transition cursor-pointer"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Drawer Content -->
      <div class="flex-1 overflow-y-auto p-4">
        <app-left></app-left>
      </div>

      <!-- Drawer Footer -->
      <div class="p-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800">
        <button
          type="button"
          (click)="closeFilterDrawer()"
          class="w-full py-3 bg-red-500 hover:bg-red-600 text-white font-extrabold text-xs rounded-xl shadow-md transition cursor-pointer"
        >
          {{ 'COMMON.CONTINUE' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
