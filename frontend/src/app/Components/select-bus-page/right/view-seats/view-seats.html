<div class="mainContainer">

  <!-- ── Seat Map ──────────────────────────────────────────────────── -->
  <div class="mainContainer1">
    <div class="seat-map-header">
      <i class="material-icons" style="font-size:16px;">directions_bus</i>
      {{ 'BOOKING.SELECT_SEATS' | translate }}
    </div>

    <div class="seat-legend">
      <div class="legend-item">
        <div class="legend-dot available"></div> {{ 'BOOKING.AVAILABLE' | translate }}
      </div>
      <div class="legend-item">
        <div class="legend-dot selected"></div> {{ 'BOOKING.SELECTED' | translate }}
      </div>
      <div class="legend-item">
        <div class="legend-dot booked"></div> {{ 'BOOKING.BOOKED' | translate }}
      </div>
    </div>

    <div class="mainContainer1Right">
      <div>
        <ng-container *ngFor="let index of generatearray(10)">
          <app-small-seats [seatno]="index" [alreadybookedseats]="filledseats"
            (seatselected)="handleselectedseats($event)" [selectedseats]="selectedseats">
          </app-small-seats>
        </ng-container>
      </div>
      <div>
        <ng-container *ngFor="let index of generatearray(10)">
          <app-small-seats [seatno]="10 + index" [alreadybookedseats]="filledseats"
            (seatselected)="handleselectedseats($event)" [selectedseats]="selectedseats">
          </app-small-seats>
        </ng-container>
      </div>
      <div></div>
      <div>
        <ng-container *ngFor="let index of generatearray(10)">
          <app-small-seats [seatno]="20 + index" [alreadybookedseats]="filledseats"
            (seatselected)="handleselectedseats($event)" [selectedseats]="selectedseats">
          </app-small-seats>
        </ng-container>
      </div>
      <div>
        <ng-container *ngFor="let index of generatearray(10)">
          <app-small-seats [seatno]="30 + index" [alreadybookedseats]="filledseats"
            (seatselected)="handleselectedseats($event)" [selectedseats]="selectedseats">
          </app-small-seats>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- ── Progressive Booking Sidebar ─────────────────────────────── -->
  <div class="mainContainer2 sticky top-20">
    <app-bus-booking-form
      [selectedseat]="selectedseats"
      [seatprice]="seatprice"
      [routedetails]="routedetails"
      [busid]="busid"
      [busarrivaltime]="busarrivaltime"
      [busdeparturetime]="busdeparturetime"
      [operatorname]="operatorname">
    </app-bus-booking-form>
  </div>
</div>
