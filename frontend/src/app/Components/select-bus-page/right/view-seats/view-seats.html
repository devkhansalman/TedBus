<div class="mainContainer grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 p-2 sm:p-4 bg-slate-50 dark:bg-slate-900/60 rounded-2xl border border-slate-200 dark:border-slate-700/60 w-full">

  <!-- ── Seat Map Section (Col 1-6 on LG) ────────────────────────── -->
  <div class="mainContainer1 lg:col-span-6 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700/80 shadow-2xs overflow-hidden flex flex-col">
    <!-- Header -->
    <div class="seat-map-header p-3 bg-slate-900 dark:bg-slate-950 text-white flex items-center justify-between text-xs font-bold">
      <div class="flex items-center gap-2">
        <mat-icon class="text-red-400 text-sm">directions_bus</mat-icon>
        <span>{{ 'BOOKING.SELECT_SEATS' | translate }}</span>
      </div>
      <span class="text-[11px] font-normal opacity-80">Front Steering Wheel →</span>
    </div>

    <!-- Legend -->
    <div class="seat-legend p-2.5 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700/60 flex flex-wrap items-center justify-around gap-2 text-[11px] font-medium text-slate-600 dark:text-slate-300">
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-3 rounded-md bg-emerald-500"></div>
        <span>{{ 'BOOKING.AVAILABLE' | translate }}</span>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-3 rounded-md bg-blue-500"></div>
        <span>{{ 'BOOKING.SELECTED' | translate }}</span>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-3 rounded-md bg-red-500"></div>
        <span>{{ 'BOOKING.BOOKED' | translate }}</span>
      </div>
    </div>

    <!-- Seat Grid (Horizontally Swipeable with Hidden Scrollbar on Mobile) -->
    <div class="mainContainer1Right p-2 sm:p-4 overflow-x-auto no-scrollbar max-w-full flex flex-col items-center gap-2">
      <!-- Row 1 -->
      <div class="flex items-center justify-center gap-1 sm:gap-2 max-w-full">
        <ng-container *ngFor="let index of generatearray(10)">
          <app-small-seats [seatno]="index" [alreadybookedseats]="filledseats"
            (seatselected)="handleselectedseats($event)" [selectedseats]="selectedseats">
          </app-small-seats>
        </ng-container>
      </div>
      <!-- Row 2 -->
      <div class="flex items-center justify-center gap-1 sm:gap-2 max-w-full">
        <ng-container *ngFor="let index of generatearray(10)">
          <app-small-seats [seatno]="10 + index" [alreadybookedseats]="filledseats"
            (seatselected)="handleselectedseats($event)" [selectedseats]="selectedseats">
          </app-small-seats>
        </ng-container>
      </div>

      <!-- Aisle Gap -->
      <div class="h-4 sm:h-6 flex items-center justify-center text-[10px] uppercase tracking-widest font-extrabold text-slate-300 dark:text-slate-600 select-none">
        — AISLE —
      </div>

      <!-- Row 3 -->
      <div class="flex items-center justify-center gap-1 sm:gap-2 max-w-full">
        <ng-container *ngFor="let index of generatearray(10)">
          <app-small-seats [seatno]="20 + index" [alreadybookedseats]="filledseats"
            (seatselected)="handleselectedseats($event)" [selectedseats]="selectedseats">
          </app-small-seats>
        </ng-container>
      </div>
      <!-- Row 4 -->
      <div class="flex items-center justify-center gap-1 sm:gap-2 max-w-full">
        <ng-container *ngFor="let index of generatearray(10)">
          <app-small-seats [seatno]="30 + index" [alreadybookedseats]="filledseats"
            (seatselected)="handleselectedseats($event)" [selectedseats]="selectedseats">
          </app-small-seats>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- ── Progressive Booking Form Section (Col 7-12 on LG) ──────────── -->
  <div class="mainContainer2 lg:col-span-6 w-full">
    <app-bus-booking-form
      [selectedseat]="selectedseats"
      [seatprice]="seatprice"
      [routedetails]="routedetails"
      [busid]="busid"
      [busarrivaltime]="busarrivaltime"
      [busdeparturetime]="busdeparturetime"
      [operatorname]="operatorname">
    </app-bus-booking-form>
  </div>
</div>
