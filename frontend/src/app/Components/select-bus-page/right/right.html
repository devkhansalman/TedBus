<div class="space-y-4 w-full">
  <app-sorting-bar></app-sorting-bar>

  <!-- Loading state -->
  <div *ngIf="isLoading" class="p-8 text-center bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xs">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-300 dark:border-slate-600 border-t-red-500 mb-2"></div>
    <p class="text-xs font-semibold text-slate-600 dark:text-slate-300">{{ 'LOADING.LOADING' | translate }}</p>
  </div>

  <!-- Error state -->
  <div *ngIf="errorMessage" class="p-6 text-center bg-red-50 dark:bg-red-950/40 rounded-2xl border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-xs font-semibold">
    {{ errorMessage }}
  </div>

  <!-- No buses found -->
  <div *ngIf="!isLoading && !errorMessage && matchedbus.length === 0" class="p-10 text-center bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xs">
    <mat-icon class="text-slate-400 text-4xl mb-2">directions_bus</mat-icon>
    <p class="text-xs font-semibold text-slate-600 dark:text-slate-300">{{ 'EMPTY.NO_RESULTS' | translate }}</p>
  </div>

  <!-- Bus list: iterate over each bus and pass real data -->
  <div *ngFor="let bus of matchedbus" class="w-full">
    <app-bus-box
      [busid]="bus._id || ''"
      [rating]="bus.rating"
      [operatorname]="bus.operatorName"
      [bustype]="bus.busType"
      [departuretime]="bus.departureTime"
      [livetracking]="bus.liveTracking"
      [reschedulable]="bus.reschedulable"
      [filledseats]="seats[bus._id || ''] || []"
      [routedetails]="route">
    </app-bus-box>
  </div>
</div>
