<button type="button" (click)="open()" class="proceedButton w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-extrabold text-xs sm:text-sm tracking-wider uppercase shadow-lg shadow-red-500/25 transition cursor-pointer flex items-center justify-center gap-2">
  <mat-icon class="text-base">confirmation_number</mat-icon>
  <span>{{ 'BOOKING.PROCEED' | translate }}</span>
</button>

<!-- Slide-Over Drawer Container -->
<div *ngIf="isOpen" class="fixed inset-0 z-[100000] flex">
  <!-- Dark Backdrop -->
  <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity" (click)="close()"></div>

  <!-- Slide-in Panel -->
  <div class="relative ml-auto w-full max-w-lg md:w-[480px] h-full bg-white dark:bg-slate-900 shadow-2xl flex flex-col z-10 overflow-hidden animate-in slide-in-from-right duration-300">
    <!-- Header with Close Button -->
    <div class="p-4 bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
      <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-2">
        <mat-icon class="text-red-500">confirmation_number</mat-icon>
        <span>{{ 'BOOKING.PROCEED' | translate }}</span>
      </h3>
      <button type="button" (click)="close()" class="p-1.5 rounded-full text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white hover:bg-slate-200 dark:hover:bg-slate-700 transition cursor-pointer">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Drawer Body -->
    <div class="flex-1 overflow-y-auto p-4">
      <app-bus-booking-form
        [selectedseat]="selectedseat"
        [seatprice]="seatprice"
        [routedetails]="routedetails"
        [busid]="busid"
        [busarrivaltime]="busarrivaltime"
        [busdeparturetime]="busdeparturetime"
        [operatorname]="operatorname">
      </app-bus-booking-form>
    </div>
  </div>
</div>
