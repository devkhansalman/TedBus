<div class="Header w-full bg-white dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-700/80 shadow-2xs transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-3 sm:px-4 lg:px-6 py-3.5 space-y-2">
    <!-- Breadcrumb & Top Note -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-xs text-slate-500 dark:text-slate-400">
      <nav aria-label="Breadcrumb" class="truncate font-medium">
        <span class="hover:text-slate-700 dark:hover:text-slate-200">{{ 'NAVBAR.HOME' | translate }}</span>
        <span class="mx-1.5 text-slate-400">&gt;</span>
        <span class="hover:text-slate-700 dark:hover:text-slate-200">{{ 'COMMON.BUS' | translate }}</span>
        <span class="mx-1.5 text-slate-400">&gt;</span>
        <span class="truncate font-semibold text-slate-700 dark:text-slate-300">
          {{ departure }} {{ 'COMMON.TO' | translate }} {{ arrival }}
        </span>
      </nav>
      <div class="text-[11px] sm:text-xs font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 px-2.5 py-1 rounded-full border border-emerald-200 dark:border-emerald-800 w-max">
        {{ 'BOOKING.FARE_STARTS_FROM' | translate }}
      </div>
    </div>

    <!-- Main Route Title Header -->
    <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-100 dark:border-slate-700/50">
      <div class="flex items-center gap-2">
        <mat-icon class="text-red-500 text-lg sm:text-xl">directions_bus</mat-icon>
        <h1 class="text-sm sm:text-base md:text-lg font-extrabold text-slate-900 dark:text-white tracking-tight">
          {{ departure }}
          <span class="text-red-500 font-normal px-1">→</span>
          {{ arrival }}
          <span class="text-xs sm:text-sm font-normal text-slate-500 dark:text-slate-400 block sm:inline sm:ml-2">
            ({{ 'BOOKING.ON' | translate }} {{ date }})
          </span>
        </h1>
      </div>
    </div>
  </div>
</div>
